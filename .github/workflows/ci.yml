name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm run install:all
      - name: Type-check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build the dashboard
        run: npm --prefix apps/dashboard run build
